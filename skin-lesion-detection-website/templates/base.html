<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lesion Insight{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <!-- Left side: Logo -->
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Lesion Insight Logo">
        <span>LesionInsight AI</span>
    </div>
    <!-- Right side: Navigation Links -->
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#how-to-use">How to Use</a></li>
        <li><a href="#contact-us">Contact Us</a></li>
        <li><a href="{{ url_for('team') }}">Team</a></li>
    </ul>
</nav>

<!-- Main Content Section -->
<div class="content">
    {% block content %}
    <!-- Page-specific content will go here -->
    {% endblock %}
</div>

<!-- Footer -->
<footer>
    <p>&copy; 2024 Lesion Insight. All rights reserved.</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
